services:
  - type: web
    name: iscpooltracker
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    healthCheckPath: "/"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: iscpooltracker-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "false"

      - key: MPESA_ENVIRONMENT
        value: "sandbox"

      - key: MPESA_MEMBERSHIP_AMOUNT
        value: "500"

      - key: MPESA_MEMBERSHIP_DAYS
        value: "30"

databases:
  - name: iscpooltracker-db
    plan: free
    databaseName: iscpooltracker
    user: iscpooltracker
