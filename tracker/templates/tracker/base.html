{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="ISC Pool"
    >

    <title>
        {% block title %}
            ISC Pool Tracker
        {% endblock %}
    </title>


    <!-- =====================================================
         APP ICON
         ===================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'tracker/icon.png' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'tracker/icon.png' %}"
    >


    <!-- =====================================================
         PWA MANIFEST
         ===================================================== -->

    <link
        rel="manifest"
        href="{% static 'tracker/manifest.json' %}"
    >


    <style>

        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            width: 100%;
            min-height: 100%;
            overflow-x: hidden;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;

            touch-action: manipulation;
        }


        body {
            width: 100%;
            min-width: 0;
            min-height: 100vh;

            overflow-x: hidden;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: var(--background);
            color: var(--text);

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        img {
            max-width: 100%;
        }


        button,
        a,
        input,
        select,
        textarea {
            font: inherit;
        }


        /* =====================================================
           LIGHT THEME
           ===================================================== */

        :root {

            --background: #f1f5f9;

            --surface: #ffffff;

            --surface-soft: #f8fafc;

            --border: #e2e8f0;

            --text: #0f172a;

            --muted: #64748b;

            --primary: #2563eb;

            --success: #16a34a;

            --danger: #dc2626;

            --radius: 16px;

            --shadow:
                0 8px 25px rgba(15, 23, 42, 0.07);
        }


        /* =====================================================
           DARK THEME
           ===================================================== */

        html[data-theme="dark"] {

            --background: #0f172a;

            --surface: #1e293b;

            --surface-soft: #273449;

            --border: #334155;

            --text: #f8fafc;

            --muted: #94a3b8;

            --primary: #60a5fa;

            --success: #4ade80;

            --danger: #f87171;

            --shadow:
                0 8px 25px rgba(0, 0, 0, 0.30);
        }


        /* =====================================================
           MAIN APPLICATION
           ===================================================== */

        .app {

            width: 100%;
            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =====================================================
           TOP HEADER
           ===================================================== */

        .app-header {

            width: 100%;

            background: var(--surface);

            border-bottom:
                1px solid var(--border);

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        .header-inner {

            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            min-height: 72px;

            padding:
                10px 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

            flex-shrink: 0;

            text-decoration: none;

            color: var(--text);
        }


        .brand-logo {

            width: 46px;
            height: 46px;

            border-radius: 12px;

            object-fit: contain;

            flex-shrink: 0;

            box-shadow: var(--shadow);
        }


        .brand-text {

            min-width: 0;
        }


        .brand-title {

            font-size: 17px;

            font-weight: 900;

            white-space: nowrap;
        }


        .brand-subtitle {

            color: var(--muted);

            font-size: 11px;

            margin-top: 2px;

            white-space: nowrap;
        }


        /* =====================================================
           NAVIGATION
           ===================================================== */

        .main-nav {

            display: flex;

            align-items: center;

            justify-content: flex-end;

            gap: 6px;

            min-width: 0;

            flex: 1;
        }


        .nav-link {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-height: 42px;

            padding:
                9px 13px;

            border-radius: 10px;

            color: var(--muted);

            text-decoration: none;

            font-size: 13px;

            font-weight: 800;

            white-space: nowrap;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
        }


        .nav-link:hover {

            background: var(--surface-soft);

            color: var(--text);

            transform: translateY(-1px);
        }


        .nav-link.active {

            background: var(--primary);

            color: white;
        }


        /* =====================================================
           THEME BUTTON
           ===================================================== */

        .theme-button {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 42px;
            height: 42px;

            padding: 0;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--surface-soft);

            color: var(--text);

            cursor: pointer;

            flex-shrink: 0;

            font-size: 18px;

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }


        .theme-button:hover {

            transform: translateY(-1px);

            background: var(--border);
        }


        /* =====================================================
           PAGE CONTAINER
           ===================================================== */

        .page-container {

            width: 100%;
            max-width: 1400px;

            margin: 0 auto;

            padding:
                30px 24px 50px;

            min-width: 0;

            overflow-x: hidden;
        }


        /* =====================================================
           CONTENT
           ===================================================== */

        main {

            width: 100%;

            min-width: 0;

            overflow-x: hidden;
        }


        /* =====================================================
           TABLE RESPONSIVENESS
           ===================================================== */

        .table-container {

            width: 100%;

            overflow-x: auto;

            -webkit-overflow-scrolling: touch;
        }


        table {

            max-width: 100%;
        }


        /* =====================================================
           FORMS
           ===================================================== */

        input,
        select,
        textarea {

            max-width: 100%;
        }


        /* =====================================================
           MOBILE NAVIGATION
           ===================================================== */

        @media (max-width: 800px) {

            .app-header {

                position: sticky;

                top: 0;
            }


            .header-inner {

                min-height: auto;

                padding:
                    10px 14px;

                flex-direction: column;

                align-items: stretch;

                gap: 10px;
            }


            .brand {

                width: 100%;

                justify-content: center;
            }


            .brand-logo {

                width: 42px;
                height: 42px;
            }


            .brand-title {

                font-size: 16px;
            }


            .brand-subtitle {

                font-size: 10px;
            }


            .main-nav {

                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(5, minmax(0, 1fr));

                gap: 5px;

                align-items: stretch;

                justify-content: stretch;
            }


            .nav-link {

                width: 100%;

                min-width: 0;

                min-height: 42px;

                padding:
                    8px 4px;

                border-radius: 9px;

                font-size: 11px;

                text-align: center;

                overflow: hidden;

                text-overflow: ellipsis;
            }


            .theme-button {

                width: 100%;

                min-height: 42px;

                height: 42px;

                border-radius: 9px;

                font-size: 16px;
            }


            .page-container {

                padding:
                    18px 12px 35px;
            }
        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media (max-width: 430px) {

            .header-inner {

                padding:
                    8px 8px;
            }


            .brand {

                gap: 9px;
            }


            .brand-logo {

                width: 38px;
                height: 38px;

                border-radius: 10px;
            }


            .brand-title {

                font-size: 14px;
            }


            .brand-subtitle {

                display: none;
            }


            .main-nav {

                gap: 3px;
            }


            .nav-link {

                min-height: 40px;

                padding:
                    7px 2px;

                font-size: 10px;

                border-radius: 8px;
            }


            .theme-button {

                min-height: 40px;

                height: 40px;

                font-size: 15px;
            }


            .page-container {

                padding:
                    14px 9px 30px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media (max-width: 360px) {

            .main-nav {

                gap: 2px;
            }


            .nav-link {

                font-size: 9px;

                padding:
                    7px 1px;
            }


            .theme-button {

                font-size: 14px;
            }
        }


        /* =====================================================
           PREVENT DOUBLE-TAP ZOOM
           ===================================================== */

        a,
        button {

            touch-action: manipulation;
        }


        /* =====================================================
           SAFE AREA FOR IPHONE
           ===================================================== */

        @supports (
            padding: env(safe-area-inset-bottom)
        ) {

            .page-container {

                padding-bottom:
                    calc(
                        30px +
                        env(safe-area-inset-bottom)
                    );
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="app-header">

        <div class="header-inner">


            <!-- BRAND -->

            <a
                href="{% url 'dashboard' %}"
                class="brand"
            >

                <img
                    src="{% static 'tracker/icon.png' %}"
                    alt="ISC Pool Tracker"
                    class="brand-logo"
                >

                <div class="brand-text">

                    <div class="brand-title">
                        ISC Pool Tracker
                    </div>

                    <div class="brand-subtitle">
                        Pool Business Management
                    </div>

                </div>

            </a>


            <!-- NAVIGATION -->

            <nav
                class="main-nav"
                aria-label="Main navigation"
            >

                <a
                    href="{% url 'dashboard' %}"
                    class="nav-link"
                    data-nav="dashboard"
                >
                    Dashboard
                </a>


                <a
                    href="{% url 'earnings_list' %}"
                    class="nav-link"
                    data-nav="earnings"
                >
                    Earnings
                </a>


                <a
                    href="{% url 'expenses_list' %}"
                    class="nav-link"
                    data-nav="expenses"
                >
                    Expenses
                </a>


                <a
                    href="{% url 'reports' %}"
                    class="nav-link"
                    data-nav="reports"
                >
                    Reports
                </a>


                <button
                    type="button"
                    class="theme-button"
                    id="themeButton"
                    aria-label="Toggle dark and light theme"
                >
                    🌙
                </button>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         PAGE
         ===================================================== -->

    <div class="page-container">

        <main>

            {% block content %}
            {% endblock %}

        </main>

    </div>


</div>


<script>

(function () {

    "use strict";


    /* =====================================================
       THEME
       ===================================================== */

    const themeButton =
        document.getElementById("themeButton");


    function getStoredTheme() {

        return localStorage.getItem(
            "iscPoolTheme"
        );

    }


    function getSystemTheme() {

        return window.matchMedia &&
            window.matchMedia(
                "(prefers-color-scheme: dark)"
            ).matches
                ? "dark"
                : "light";

    }


    function applyTheme(theme) {

        document.documentElement
            .setAttribute(
                "data-theme",
                theme
            );


        if (themeButton) {

            themeButton.textContent =
                theme === "dark"
                    ? "☀️"
                    : "🌙";

        }


        window.dispatchEvent(
            new CustomEvent(
                "iscThemeChanged"
            )
        );

    }


    const savedTheme =
        getStoredTheme();


    applyTheme(
        savedTheme ||
        getSystemTheme()
    );


    if (themeButton) {

        themeButton.addEventListener(
            "click",
            function () {

                const current =
                    document.documentElement
                        .getAttribute(
                            "data-theme"
                        ) ||
                    "light";


                const next =
                    current === "dark"
                        ? "light"
                        : "dark";


                localStorage.setItem(
                    "iscPoolTheme",
                    next
                );


                applyTheme(next);

            }
        );

    }


    /* =====================================================
       ACTIVE NAVIGATION
       ===================================================== */

    const path =
        window.location.pathname;


    const navLinks =
        document.querySelectorAll(
            ".nav-link"
        );


    navLinks.forEach(
        function (link) {

            const nav =
                link.getAttribute(
                    "data-nav"
                );


            let active = false;


            if (
                nav === "dashboard" &&
                (
                    path === "/" ||
                    path === ""
                )
            ) {

                active = true;

            }


            if (
                nav === "earnings" &&
                path.startsWith(
                    "/earnings"
                )
            ) {

                active = true;

            }


            if (
                nav === "expenses" &&
                path.startsWith(
                    "/expenses"
                )
            ) {

                active = true;

            }


            if (
                nav === "reports" &&
                path.startsWith(
                    "/reports"
                )
            ) {

                active = true;

            }


            if (active) {

                link.classList.add(
                    "active"
                );

            }

        }
    );


})();

</script>


</body>

</html>
