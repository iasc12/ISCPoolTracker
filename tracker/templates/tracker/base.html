
{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>
        {% block title %}
            ISC Pool Tracker
        {% endblock %}
    </title>

    <!-- =====================================================
         ISC POOL TRACKER APP ICON
         ===================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'tracker/icon.png' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'tracker/icon.png' %}"
    >

    <!-- =====================================================
         PROGRESSIVE WEB APP
         ===================================================== -->

    <link
        rel="manifest"
        href="{% static 'tracker/manifest.json' %}"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="ISC Pool"
