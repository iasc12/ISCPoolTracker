{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#2563eb"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="ISC Pool"
    >

    <title>
        {% block title %}
            ISC Pool Tracker
        {% endblock %}
    </title>

    <!-- APP ICON -->

    <link
        rel="icon"
        type="image/png"
        href="{% static 'tracker/icon.png' %}"
    >

    <link
        rel="apple-touch-icon"
        href="{% static 'tracker/icon.png' %}"
    >

    <!-- PWA -->

    <link
        rel="manifest"
        href="{% static 'tracker/manifest.json' %}"
    >

    <style>

        /* =====================================================
           ROOT
           ===================================================== */

        :root {

            --primary: #2563eb;
            --primary-dark: #1d4ed8;

            --success: #16a34a;
            --danger: #dc2626;

            --background: #f8fafc;
            --surface: #ffffff;
            --surface-soft: #f1f5f9;

            --text: #0f172a;
            --muted: #64748b;

            --border: #e2e8f0;

            --shadow:
                0 8px 25px rgba(15, 23, 42, 0.07);

            --radius: 16px;

            --nav-height: 72px;
        }


        /* =====================================================
           DARK THEME
           ===================================================== */

        html[data-theme="dark"] {

            --background: #0f172a;

            --surface: #1e293b;

            --surface-soft: #334155;

            --text: #f8fafc;

            --muted: #94a3b8;

            --border: #334155;

            --shadow:
                0 8px 25px rgba(0, 0, 0, 0.25);
        }


        /* =====================================================
           RESET
           ===================================================== */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        html {

            width: 100%;

            min-width: 100%;

            overflow-x: hidden;

            scroll-behavior: smooth;
        }


        body {

            width: 100%;

            min-width: 0;

            min-height: 100vh;

            overflow-x: hidden;

            background:
                var(--background);

            color:
                var(--text);

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            line-height: 1.5;

            -webkit-text-size-adjust: 100%;

            text-size-adjust: 100%;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        button,
        input,
        select,
        textarea {

            font:
                inherit;
        }


        img {

            max-width: 100%;

            height: auto;
        }


        a {

            color: inherit;
        }


        /* =====================================================
           APP
           ===================================================== */

        .app {

            width: 100%;

            min-height: 100vh;

            display: flex;

            flex-direction: column;
        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {

            width: 100%;

            min-height:
                var(--nav-height);

            background:
                var(--surface);

            border-bottom:
                1px solid var(--border);

            box-shadow:
                0 2px 12px rgba(
                    15,
                    23,
                    42,
                    0.05
                );

            position: sticky;

            top: 0;

            z-index: 1000;
        }


        .nav-inner {

            width: 100%;

            max-width: 1400px;

            min-width: 0;

            margin: 0 auto;

            min-height:
                var(--nav-height);

            padding:
                10px 24px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;
        }


        /* =====================================================
           BRAND
           ===================================================== */

        .brand {

            display: flex;

            align-items: center;

            gap: 11px;

            min-width: 0;

            text-decoration: none;
        }


        .brand-logo {

            width: 45px;

            height: 45px;

            flex-shrink: 0;

            object-fit: contain;

            border-radius: 11px;

            box-shadow:
                0 4px 12px
                rgba(15, 23, 42, 0.12);
        }


        .brand-text {

            min-width: 0;
        }


        .brand-name {

            display: block;

            font-size: 16px;

            font-weight: 900;

            line-height: 1.1;

            white-space: nowrap;
        }


        .brand-subtitle {

            display: block;

            margin-top: 2px;

            color:
                var(--muted);

            font-size: 10px;

            font-weight: 700;

            letter-spacing: 0.6px;

            white-space: nowrap;
        }


        /* =====================================================
           NAV LINKS
           ===================================================== */

        .nav-links {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            min-width: 0;

            flex: 1;
        }


        .nav-link {

            min-height: 42px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding:
                9px 13px;

            border-radius: 10px;

            text-decoration: none;

            color:
                var(--muted);

            font-size: 13px;

            font-weight: 800;

            white-space: nowrap;

            transition:
                background 0.18s ease,
                color 0.18s ease,
                transform 0.18s ease;
        }


        .nav-link:hover {

            background:
                var(--surface-soft);

            color:
                var(--text);

            transform:
                translateY(-1px);
        }


        .nav-link.active {

            background:
                rgba(37, 99, 235, 0.10);

            color:
                var(--primary);
        }


        /* =====================================================
           THEME BUTTON
           ===================================================== */

        .theme-button {

            min-width: 42px;

            width: 42px;

            height: 42px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background:
                var(--surface-soft);

            color:
                var(--text);

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            font-size: 18px;

            transition:
                transform 0.18s ease,
                background 0.18s ease;
        }


        .theme-button:hover {

            transform:
                translateY(-2px);
        }


        /* =====================================================
           MAIN
           ===================================================== */

        .main {

            width: 100%;

            flex: 1;

            min-width: 0;
        }


        .main-inner {

            width: 100%;

            max-width: 1400px;

            min-width: 0;

            margin: 0 auto;

            padding:
                30px 24px 40px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {

            width: 100%;

            background:
                var(--surface);

            border-top:
                1px solid var(--border);

            margin-top: auto;
        }


        .footer-inner {

            width: 100%;

            max-width: 1400px;

            margin: 0 auto;

            padding:
                24px;

            text-align: center;
        }


        .footer-title {

            font-size: 13px;

            font-weight: 900;

            color:
                var(--text);

            letter-spacing: 0.4px;
        }


        .footer-slogan {

            margin-top: 5px;

            color:
                var(--muted);

            font-size: 12px;

            font-weight: 600;

            font-style: italic;
        }


        .footer-copy {

            margin-top: 8px;

            color:
                var(--muted);

            font-size: 10px;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 900px) {

            .nav-inner {

                padding:
                    9px 16px;

                gap: 10px;
            }


            .brand-subtitle {

                display: none;
            }


            .nav-links {

                gap: 2px;
            }


            .nav-link {

                padding:
                    8px 9px;

                font-size: 12px;
            }


            .main-inner {

                padding:
                    24px 16px 35px;
            }
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 700px) {

            :root {

                --nav-height: auto;
            }


            .navbar {

                position: relative;
            }


            .nav-inner {

                min-height: auto;

                padding:
                    10px 10px 8px;

                display: grid;

                grid-template-columns:
                    auto 1fr auto;

                gap: 8px;

                align-items: center;
            }


            .brand {

                gap: 7px;

                min-width: 0;
            }


            .brand-logo {

                width: 40px;

                height: 40px;

                border-radius: 9px;
            }


            .brand-name {

                font-size: 13px;
            }


            .nav-links {

                width: 100%;

                min-width: 0;

                overflow-x: auto;

                overflow-y: hidden;

                justify-content: flex-start;

                scrollbar-width: none;

                -webkit-overflow-scrolling: touch;
            }


            .nav-links::-webkit-scrollbar {

                display: none;
            }


            .nav-link {

                flex-shrink: 0;

                min-height: 38px;

                padding:
                    8px 9px;

                font-size: 11px;

                border-radius: 8px;
            }


            .theme-button {

                width: 38px;

                height: 38px;

                min-width: 38px;

                font-size: 16px;
            }


            .main-inner {

                padding:
                    18px 12px 30px;
            }


            .footer-inner {

                padding:
                    20px 12px;
            }
        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media (max-width: 420px) {

            .nav-inner {

                grid-template-columns:
                    auto 1fr auto;

                padding:
                    8px;
            }


            .brand-logo {

                width: 36px;

                height: 36px;
            }


            .brand-name {

                font-size: 12px;
            }


            .nav-link {

                padding:
                    7px 8px;

                font-size: 10px;
            }


            .theme-button {

                width: 36px;

                height: 36px;

                min-width: 36px;
            }


            .main-inner {

                padding:
                    14px 9px 25px;
            }
        }


    </style>

</head>


<body>

<div class="app">


    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <header class="navbar">

        <div class="nav-inner">


            <!-- BRAND -->

            <a
                href="{% url 'dashboard' %}"
                class="brand"
            >

                <img
                    src="{% static 'tracker/images/pool-logo.png' %}"
                    alt="ISC Pool Tracker"
                    class="brand-logo"
                >

                <span class="brand-text">

                    <span class="brand-name">
                        ISC Pool
                    </span>

                    <span class="brand-subtitle">
                        TRACKER
                    </span>

                </span>

            </a>


            <!-- LINKS -->

            <nav class="nav-links">

                <a
                    href="{% url 'dashboard' %}"
                    class="nav-link"
                >
                    Dashboard
                </a>


                <a
                    href="{% url 'earnings_list' %}"
                    class="nav-link"
                >
                    Earnings
                </a>


                <a
                    href="{% url 'expenses_list' %}"
                    class="nav-link"
                >
                    Expenses
                </a>


                <a
                    href="{% url 'reports' %}"
                    class="nav-link"
                >
                    Reports
                </a>

            </nav>


            <!-- THEME -->

            <button
                type="button"
                class="theme-button"
                id="themeButton"
                aria-label="Toggle theme"
            >
                ☀️
            </button>


        </div>

    </header>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="main">

        <div class="main-inner">

            {% block content %}

            {% endblock %}

        </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="footer">

        <div class="footer-inner">

            <div class="footer-title">
                Isaac Njoroge Build
            </div>

            <div class="footer-slogan">
                Another Day, Another Dollar
            </div>

            <div class="footer-copy">
                © {% now "Y" %} ISC Pool Tracker. All rights reserved.
            </div>

        </div>

    </footer>


</div>


<script>

(function () {

    const root =
        document.documentElement;

    const button =
        document.getElementById(
            "themeButton"
        );


    function getTheme() {

        return localStorage.getItem(
            "iscTheme"
        ) || "light";
    }


    function applyTheme(theme) {

        root.setAttribute(
            "data-theme",
            theme
        );


        if (button) {

            button.textContent =
                theme === "dark"
                    ? "☀️"
                    : "🌙";
        }


        window.dispatchEvent(
            new CustomEvent(
                "iscThemeChanged"
            )
        );
    }


    applyTheme(
        getTheme()
    );


    if (button) {

        button.addEventListener(
            "click",
            function () {

                const current =
                    getTheme();

                const next =
                    current === "dark"
                        ? "light"
                        : "dark";

                localStorage.setItem(
                    "iscTheme",
                    next
                );

                applyTheme(
                    next
                );

            }
        );
    }

})();

</script>


</body>

</html>
